# Verified-public values the pattern-class audit (layer 2) lets through, and public terms
# the novelty scan does not need to ask about.
#
# Every entry carries a `why` that a reviewer can check without trusting whoever added it:
# name the public source. Nothing here may be specific to one source organisation; a value
# that is public but would hint at WHICH organisation a corpus came from (a regulator, a
# national standard, a customer's vendor) belongs in that source's private mapping instead.
#
#   class    the audit class the entry exempts (see PATTERN_CLASSES in audit.py), or `term`
#            for the novelty scan
#   value    literal, case-insensitive. Domains cover their subdomains unless
#            `subdomains: false`; addresses may be CIDRs.
#   pattern  regex the whole match must satisfy
#   context  regex searched in the line around the match
#   paths    optional globs limiting where the entry applies
#
# A domain entry exempts the domain, not the labels in front of it: a storage account in
# <name>.blob.core.windows.net or a bucket in <name>.s3.amazonaws.com is still covered by
# the literal and novelty layers.
