{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "docs-distributor.fullname" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docs-distributor.labels" . | nindent 4 }}
  annotations:
    # The LLM cache is what makes re-runs byte-identical, and the run reports are the only
    # place a blocked run's proposal exists. An uninstall must not take them with it.
    helm.sh/resource-policy: keep
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
