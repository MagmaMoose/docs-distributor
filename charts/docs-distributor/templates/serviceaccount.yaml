{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "docs-distributor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docs-distributor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role is bound: the job never calls the Kubernetes API.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
