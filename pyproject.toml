[project]
name = "docs-distributor"
dynamic = ["version"]
description = "One-way sync of documentation from private repositories into a public docs site, anonymised on the way and gated by a deterministic leak audit."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Caleb Sargeant", email = "caleb@magmamoose.com" }]
keywords = ["documentation", "anonymisation", "mkdocs", "gitops", "kubernetes"]

# Runtime dependencies. audit.py uses none of them: the gate is stdlib-only on purpose, and
# tests/test_audit.py fails if that ever changes.
dependencies = [
    "PyYAML>=6.0.2",
    "httpx>=0.28",
    # Signs the RS256 JWT a GitHub App exchanges for an installation token. Nothing else.
    "cryptography>=44",
    # Novelty only: tells a capitalised English word ("Structure", "Usage") from a name, so
    # the classifier is asked about names and not about the language. Pinned, because a new
    # word list is a new set of candidates and therefore a new set of LLM calls.
    "wordfreq==3.1.1",
]

[project.optional-dependencies]
# `verify` builds the target docs site with `mkdocs build --strict`, so it needs that site's
# toolchain. These pins mirror the docs repo's docs/requirements.txt; the container image
# installs them, and verify.py warns when the two drift apart.
verify = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==11.0.1",
    "mdx-truly-sane-lists==1.3",
]

[project.scripts]
docs-distributor = "docs_distributor.cli:main"

[project.urls]
Homepage = "https://github.com/MagmaMoose/docs-distributor"
Source = "https://github.com/MagmaMoose/docs-distributor"
Issues = "https://github.com/MagmaMoose/docs-distributor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_distributor"]

[tool.hatch.version]
path = "src/docs_distributor/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# `S` (bandit) and `BLE` (blind except) stay on: this tool shells out to git and claude,
# reads secrets and posts to GitHub, which is exactly where a swallowed exception or an
# unchecked subprocess argument turns into a leak.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "wordfreq", "wordfreq.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff",
    "mypy",
    "respx>=0.22",
    "types-PyYAML",
]
